		<script>
			(function () {
				var storageKey = 'muninn-theme';
				var savedTheme = null;
				try { savedTheme = localStorage.getItem(storageKey); } catch (_error) {}
				var theme = savedTheme === 'dark' || savedTheme === 'light'
					? savedTheme
					: (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				document.documentElement.dataset.theme = theme;
				document.addEventListener('DOMContentLoaded', function () {
					var toggle = document.getElementById('theme-toggle');
					var themeColor = document.querySelector('meta[name="theme-color"]');
					function syncThemeControl() {
						var isDark = document.documentElement.dataset.theme === 'dark';
						if (toggle) {
							toggle.setAttribute('aria-pressed', String(isDark));
							var label = toggle.querySelector('.theme-toggle-label');
							if (label) label.textContent = isDark ? 'Light' : 'Dark';
						}
						if (themeColor) themeColor.setAttribute('content', isDark ? '#11191e' : '#f3f5f4');
					}
					if (toggle) toggle.addEventListener('click', function () {
						var nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
						document.documentElement.dataset.theme = nextTheme;
						try { localStorage.setItem(storageKey, nextTheme); } catch (_error) {}
						syncThemeControl();
					});
					syncThemeControl();
				});
			})();
		</script>

			<!-- Story loading script -->
			<script>
				$(document).ready(function() {
					// Get story ID from URL parameter
					var urlParams = new URLSearchParams(window.location.search);
					var storyId = parseInt(urlParams.get('id'));
					var storyKey = (urlParams.get('sid') || '').trim();
					var feed = (urlParams.get('feed') || '').toLowerCase();
					var returnCategory = (urlParams.get('returnCategory') || '').trim();
					var archiveDate = (urlParams.get('archiveDate') || '').trim();
					var returnMore = urlParams.get('returnMore') === '1';
					var digestPath = '/Current_news/digest.json';
					if (feed === 'ai') {
						digestPath = '/Current_news/ai_digest.json';
					}
					var backHref = '/';
					if (returnCategory) {
						backHref = '/?category=' + encodeURIComponent(returnCategory);
					} else if (returnMore) {
						backHref = '/?moreNews=1';
					}

					if (!storyKey && (isNaN(storyId) || storyId < 0)) {
						$('#story-content').html('<div class="error"><h2>Invalid Story</h2><p>Story not found. <a href="/">Return to home</a></p></div>');
						return;
					}

					// Helper function to get canonical logo name for major publishers
					function getCanonicalLogoName(sourceName) {
						var lowerSource = String(sourceName || '').toLowerCase().trim();

						// Keep feed/desk suffixes from producing different files for one newsroom.
						// More specific names must appear before short names such as TIME and AP.
						var publisherMap = [
							['google news', 'google-news'],
							['new york times', 'new-york-times'],
							['japan times', 'japan-times'],
							['associated press', 'ap'],
							['ap news', 'ap'],
							['npr', 'npr'],
							['nbc', 'nbc-news'],
							['abc news', 'abc-news'],
							['cbs', 'cbs-news'],
							['politico', 'politico'],
							['cnn', 'cnn'],
							['fox', 'fox-news'],
							['pbs', 'pbs-news'],
							['newsnation', 'newsnation'],
							['bbc', 'bbc'],
							['al jazeera', 'al-jazeera'],
							['guardian', 'the-guardian'],
							['sky news', 'sky-news'],
							['france 24', 'france-24'],
							['deutsche welle', 'dw'],
							['cbc', 'cbc-news'],
							['channel newsasia', 'channel-newsasia'],
							['sbs news', 'sbs-news'],
							['africanews', 'africanews'],
							['the hindu', 'the-hindu'],
							['rte news', 'rte-news'],
							['euronews', 'euronews'],
							['time', 'time'],
							['reuters', 'reuters'],
							['los angeles times', 'los-angeles-times'],
							['roll call', 'roll-call'],
							['the hill', 'the-hill'],
							['upi', 'upi'],
							['usa today', 'usa-today'],
							['vox', 'vox']
						];

						// Check if source matches any major publisher
						if (lowerSource === 'ap' || lowerSource.indexOf('ap -') === 0) return 'ap';
						if (lowerSource === 'dw' || lowerSource.indexOf('dw -') === 0) return 'dw';
						for (var i = 0; i < publisherMap.length; i++) {
							if (lowerSource.indexOf(publisherMap[i][0]) !== -1) {
								return publisherMap[i][1];
							}
						}

						return null;
					}

					// Helper function to extract domain from source name
					function getSourceDomain(sourceName) {
						// First check if it's a major publisher
						var canonical = getCanonicalLogoName(sourceName);
						if (canonical) {
							return canonical;
						}

						// Otherwise, extract domain from source name
						var domain = sourceName.toLowerCase()
							.replace(/\s*\(google news\)\s*/gi, '')
							.replace(/\s*google news\s*-\s*/gi, '')
							.replace(/\s*\(site\)\s*/gi, '')
							.trim()
							.replace(/\s+/g, '-')
							.replace(/[^a-z0-9-]/g, '');
						return domain;
					}

					function escapeHtml(value) {
						return String(value || '')

								var domain = getSourceDomain(item.source);
								var logoPath = '/assets/logos/' + domain + '.png';
								var sourceHtml = '<div class="source-item">';
								sourceHtml += '<img src="' + escapeHtml(logoPath) + '" alt="' + escapeHtml((item.source || 'News outlet') + ' logo') + '" title="' + escapeHtml(item.source || 'News outlet') + '" class="source-logo" onerror="this.onerror=null;this.src=\'/assets/logos/news_placeholder.png\'">';
								sourceHtml += '<div class="source-info">';
								sourceHtml += '<a href="' + escapeHtml(safeHttpUrl(item.link)) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(item.title || 'Read original report') + '</a>';
								sourceHtml += '<div class="source-outlet">' + escapeHtml(item.source || 'Unknown outlet') + '</div>';
								sourceHtml += window.MuninnEventExperience.renderSourceBadges(item);
								sourceHtml += '</div>';
								sourceHtml += '</div>';
								return sourceHtml;
							};

							storyItems.slice(0, 5).forEach(function(item) {
								content += renderSourceItem(item);
							});
							if (storyItems.length > 5) {
								content += '<details class="source-overflow"><summary>Show ' + (storyItems.length - 5) + ' more source' + (storyItems.length - 5 === 1 ? '' : 's') + '</summary>';
								storyItems.slice(5).forEach(function(item) { content += renderSourceItem(item); });
								content += '</details>';
							}

							content += '</div>';
						}

						// Other stories section
						content += '<div class="other-stories-section">';
						content += '<h2>' + escapeHtml(archiveDate ? 'More from ' + formatStoryDate(archiveDate) : 'More from today') + '</h2>';
						content += '<div class="other-stories-grid" id="other-stories-grid"></div>';
						content += '</div>';

						$('#story-content').html(content);
						$('#story-content').off('click', '.story-explore-option').on('click', '.story-explore-option', function() {
							var button = $(this);
							var wasOpen = button.attr('aria-expanded') === 'true';
							var panelId = button.attr('aria-controls');
							$('#story-content .story-explore-option').attr('aria-expanded', 'false');
							$('#story-content .story-explore-panel').removeClass('active');
							if (!wasOpen) {
								button.attr('aria-expanded', 'true');
								$('#' + panelId).addClass('active');
							}
						});
						$('#story-content').off('mouseenter focus click', '.event-storyline-card').on('focus click', '.event-storyline-card', function(event) {
							if (event.type === 'click') event.preventDefault();
							var card = $(this);
							var preview = card.closest('.event-storyline');
							preview.find('.event-storyline-card').removeClass('is-active').attr('aria-pressed', 'false');
							card.addClass('is-active').attr('aria-pressed', 'true');
							preview.find('.event-storyline-detail-label').text(card.attr('data-event-preview-label') || 'Development');
							preview.find('.event-storyline-detail-date').text(card.attr('data-event-preview-date') || '');
							preview.find('.event-storyline-detail-title').text(card.attr('data-event-preview-title') || 'Update');
							var summary = card.attr('data-event-preview-summary') || '';
							preview.find('.event-storyline-detail-summary').text(summary).prop('hidden', !summary);
							var facts = [];
							try { facts = JSON.parse(card.attr('data-event-preview-facts') || '[]'); } catch (_error) {}
							var factsList = preview.find('.event-storyline-detail-facts').empty().prop('hidden', !facts.length);
							facts.forEach(function(fact) { factsList.append($('<li>').text(fact)); });
							var type = card.attr('data-event-preview-type') || 'update';
							var sourceCount = Number(card.attr('data-event-preview-sources') || 0);
							preview.find('.event-storyline-detail-type').text(type);
							preview.find('.event-storyline-detail-sources').text(sourceCount + ' source' + (sourceCount === 1 ? '' : 's')).prop('hidden', !sourceCount);
						});

						var mountCompactEventPreview = function(eventData) {
							var slot = $('#event-timeline-slot');
							if (slot.length) slot.html(renderStoryContext(story, eventData));
						};
						if (hasEventTimeline) mountCompactEventPreview(null);

						if (hasEventTimeline && story.event_id) {
							$.getJSON('/Current_news/event_timelines.json', function(timelineData) {
								var events = Array.isArray(timelineData.events) ? timelineData.events : [];
								var eventData = events.find(function(event) {
									return event.event_id === story.event_id;
								});
								if (eventData) mountCompactEventPreview(eventData);
							});
						}
						// Prefer genuinely related coverage, then fill with a small selection from today.
						var otherStories = data.clusters.filter(function(s, index) {
							return index !== storyIndex;
						}).map(function(candidate, index) {
							return { story: candidate, index: index, score: relatednessScore(story, candidate) };
						}).sort(function(left, right) {
							return right.score - left.score || left.index - right.index;
						}).slice(0, 4).map(function(entry) { return entry.story; });

						otherStories.forEach(function(otherStory, index) {
							// Find the actual index in the original array
							var actualIndex = data.clusters.findIndex(function(s) {
								return s.title === otherStory.title;
							});

							var otherRef = otherStory.story_id
								? 'sid=' + encodeURIComponent(otherStory.story_id)
								: 'id=' + actualIndex;
							var otherUrl = '/story.html?' + otherRef + (feed ? '&feed=' + encodeURIComponent(feed) : '') + (archiveDate ? '&archiveDate=' + encodeURIComponent(archiveDate) : '') + (returnCategory ? '&returnCategory=' + encodeURIComponent(returnCategory) : '') + (returnMore ? '&returnMore=1' : '');
							var card = '<a class="other-story-card" href="' + escapeHtml(otherUrl) + '">';

							card += '<div class="other-story-title">' + escapeHtml(otherStory.title) + '</div>';

							if (otherStory.image && (otherStory.image.url || otherStory.image.thumbnail_url)) {
								card += '<img src="' + escapeHtml(safeHttpUrl(otherStory.image.thumbnail_url || otherStory.image.url)) + '" alt="" class="other-story-image">';
							}

							card += '</a>';

							$('#other-stories-grid').append(card);
						});

					}).fail(function() {
						$('#story-content').html('<div class="error"><h2>Error Loading Story</h2><p>Unable to load the story. Please try again later. <a href="/">Return to home</a></p></div>');
					});
				});
			</script>

	</body>
</html>
