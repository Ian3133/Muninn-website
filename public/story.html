			.story-explore { margin: 0 0 3rem; padding: clamp(1.2rem, 3vw, 1.7rem); border: 1px solid #dbe2e6; border-radius: 16px; background: #fafbfb; }

			.story-explore-option:hover { border-color: #18a9d3; color: #147d9c; }

			.story-explore-panel { display: none; margin-top: 1rem; padding: 1.05rem 1.15rem; border-left: 3px solid #18a9d3; border-radius: 0 10px 10px 0; background: #edf6f8; color: #26343e; }

	<body class="is-preload">

		<!-- Wrapper -->
			<div id="wrapper" class="fade-in">

				<!-- Header -->
					<header id="header">
						<a href="/" class="logo">Muninn</a>
					</header>

							<div id="story-content" class="story-container">

						</section>

			</div>

		<!-- Scripts -->
			<script src="/assets/js/jquery.min.js"></script>
			<script src="/assets/js/jquery.scrollex.min.js"></script>
			<script src="/assets/js/jquery.scrolly.min.js"></script>
			<script src="/assets/js/browser.min.js"></script>
			<script src="/assets/js/breakpoints.min.js"></script>
			<script src="/assets/js/util.js"></script>
			<script src="/assets/js/main.js"></script>
			<script src="/assets/js/event-experience.js"></script>

			<!-- Story loading script -->
			<script>
				$(document).ready(function() {
					// Get story ID from URL parameter
					var urlParams = new URLSearchParams(window.location.search);
					var storyId = parseInt(urlParams.get('id'));
					var storyKey = (urlParams.get('sid') || '').trim();
					var feed = (urlParams.get('feed') || '').toLowerCase();
					var returnCategory = (urlParams.get('returnCategory') || '').trim();
					var digestPath = '/Current_news/digest.json';
					if (feed === 'ai') {
						digestPath = '/Current_news/ai_digest.json';
					}
					var backHref = '/';
					if (returnCategory) {
						backHref = '/?category=' + encodeURIComponent(returnCategory);
					}

					if (!storyKey && (isNaN(storyId) || storyId < 0)) {
						$('#story-content').html('<div class="error"><h2>Invalid Story</h2><p>Story not found. <a href="/">Return to home</a></p></div>');
						return;
					}

					// Helper function to get canonical logo name for major publishers
					function getCanonicalLogoName(sourceName) {
						var lowerSource = String(sourceName || '').toLowerCase().trim();

						// Keep feed/desk suffixes from producing different files for one newsroom.
						// More specific names must appear before short names such as TIME and AP.
						var publisherMap = [
							['google news', 'google-news'],
							['new york times', 'new-york-times'],
							['japan times', 'japan-times'],
							['associated press', 'ap'],
							['ap news', 'ap'],
							['npr', 'npr'],
							['nbc', 'nbc-news'],
							['abc news', 'abc-news'],
							['cbs', 'cbs-news'],
							['politico', 'politico'],
							['cnn', 'cnn'],
							['fox', 'fox-news'],
							['pbs', 'pbs-news'],
							['newsnation', 'newsnation'],
							['bbc', 'bbc'],
							['al jazeera', 'al-jazeera'],
							['guardian', 'the-guardian'],
							['sky news', 'sky-news'],
							['france 24', 'france-24'],
							['deutsche welle', 'dw'],
							['cbc', 'cbc-news'],
							['channel newsasia', 'channel-newsasia'],
							['sbs news', 'sbs-news'],
							['africanews', 'africanews'],
							['the hindu', 'the-hindu'],
							['rte news', 'rte-news'],
							['euronews', 'euronews'],
							['time', 'time'],
							['reuters', 'reuters'],
							['los angeles times', 'los-angeles-times'],
							['roll call', 'roll-call'],
							['the hill', 'the-hill'],
							['upi', 'upi'],
							['usa today', 'usa-today'],
							['vox', 'vox']
						];

						// Check if source matches any major publisher
						if (lowerSource === 'ap' || lowerSource.indexOf('ap -') === 0) return 'ap';
						if (lowerSource === 'dw' || lowerSource.indexOf('dw -') === 0) return 'dw';
						for (var i = 0; i < publisherMap.length; i++) {
							if (lowerSource.indexOf(publisherMap[i][0]) !== -1) {
								return publisherMap[i][1];
							}
						}

						return null;
					}

					// Helper function to extract domain from source name
					function getSourceDomain(sourceName) {
						// First check if it's a major publisher
						var canonical = getCanonicalLogoName(sourceName);
						if (canonical) {
							return canonical;
						}

						// Otherwise, extract domain from source name
						var domain = sourceName.toLowerCase()
							.replace(/\s*\(google news\)\s*/gi, '')
							.replace(/\s*google news\s*-\s*/gi, '')
							.replace(/\s*\(site\)\s*/gi, '')
							.trim()
							.replace(/\s+/g, '-')
							.replace(/[^a-z0-9-]/g, '');
						return domain;
					}

					function escapeHtml(value) {
						return String(value || '')
							.replace(/&/g, '&amp;')
							.replace(/</g, '&lt;')
							.replace(/>/g, '&gt;')
							.replace(/"/g, '&quot;')
							.replace(/'/g, '&#039;');
					}

					function safeHttpUrl(value) {
						try {
							var parsed = new URL(String(value || ''), window.location.origin);
							return parsed.protocol === 'http:' || parsed.protocol === 'https:' ? parsed.href : '#';
						} catch (_error) {
							return '#';
						}
					}

					function formatStoryDate(value) {
						if (!value) return 'Date unavailable';
						var parsed = new Date(String(value).length === 10 ? value + 'T12:00:00Z' : value);
						if (isNaN(parsed.getTime())) return String(value);
						return parsed.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
					}

					function displayCategory(story) {
						var category = String(story.category || '').trim();
						return !category || category.toLowerCase() === 'top story' ? 'News' : category;
					}

					function relatednessScore(left, right) {
						var stop = { the: 1, and: 1, for: 1, with: 1, from: 1, after: 1, amid: 1, into: 1, over: 1, 2026: 1 };
						var words = function(value) {
							return String(value || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(function(word) { return word.length > 2 && !stop[word]; });
						};
						var leftWords = words(left.title);
						var rightWords = words(right.title);
						var shared = leftWords.filter(function(word) { return rightWords.indexOf(word) !== -1; }).length;
						var sameCategory = displayCategory(left) === displayCategory(right) ? 2 : 0;
						return shared * 3 + sameCategory;
					}

					function renderStoryContext(story, eventData) {
						var event = eventData || {};
						var context = story.story_context || {};
						var presentation = event.presentation || {};
						var timeline = Array.isArray(context.highlights) && context.highlights.length
							? context.highlights
							: (Array.isArray(story.timeline_highlights) ? story.timeline_highlights : []);
						timeline = timeline.filter(function(entry) {
							return !story.story_id || entry.development_id !== story.story_id;
						});
						if (!timeline.length) return '';

						var html = '<div class="timeline-section">';
						html += '<h2>' + escapeHtml(context.label || 'The story so far') + '</h2>';
						if (context.summary || presentation.context_summary) {
							html += '<p class="timeline-summary">' + escapeHtml(context.summary || presentation.context_summary) + '</p>';
						}
						html += '<div class="timeline-list">';
						timeline.slice(-4).forEach(function(entry) {
							html += '<div class="timeline-item">';
							html += '<div class="timeline-date">' + escapeHtml(formatStoryDate(entry.date)) + '</div>';
							html += '<div class="timeline-title">' + escapeHtml(entry.title || 'Update') + '</div>';
							html += '</div>';
						});
						html += '</div>';
						var developmentCount = Math.max(
							Number(context.development_count || 0),
							Number(presentation.development_count || 0),
							timeline.length,
							Array.isArray(story.timeline_highlights) ? story.timeline_highlights.length : 0
						);
						var dateCount = context.date_count || presentation.date_count || 0;
						html += '<div class="timeline-actions"><span class="timeline-meta">' + escapeHtml(developmentCount) + ' developments';
						if (dateCount) html += ' across ' + escapeHtml(dateCount) + ' dates';
						html += '</span>';
						var fullTimeline = context.full_timeline_available || presentation.has_full_timeline;
						if (fullTimeline && story.event_id) {
							var timelineUrl = context.timeline_url || ('/timeline.html?event=' + encodeURIComponent(story.event_id));
							html += '<a class="timeline-button" href="' + escapeHtml(timelineUrl) + '">' + escapeHtml(context.cta_label || presentation.cta_label || 'Explore full timeline') + ' &rarr;</a>';
						}
						html += '</div>';
						var related = Array.isArray(event.related_events) && event.related_events.length ? event.related_events : context.related_events;
						if (Array.isArray(related) && related.length) {
							html += '<div class="related-topics"><strong>Related threads</strong><div>';
							related.slice(0, 4).forEach(function(item) {
								html += '<a class="related-topic-link" href="/timeline.html?event=' + encodeURIComponent(item.event_id || '') + '">' + escapeHtml(item.title || 'Related topic') + '</a>';
							});
							html += '</div></div>';
						}
						html += '</div>';
						return html;
					}

					function renderStoryExplainer(story) {
						var explainer = story.explainer || story.context_explainer || (story.story_context || {}).explainer;
						if (!explainer) return '';
						if (typeof explainer === 'string') explainer = { summary: explainer };
						var paragraphs = Array.isArray(explainer.paragraphs) ? explainer.paragraphs : [explainer.summary || explainer.text].filter(Boolean);
						var points = Array.isArray(explainer.key_points) ? explainer.key_points.filter(Boolean) : [];
						if (!paragraphs.length && !points.length) return '';
						var html = '<section class="story-explainer"><div class="story-section-label">Additional context</div><h2>' + escapeHtml(explainer.title || 'Why this story matters') + '</h2>';
						paragraphs.forEach(function(paragraph) { html += '<p>' + escapeHtml(paragraph) + '</p>'; });
						if (points.length) html += '<ul>' + points.map(function(point) { return '<li>' + escapeHtml(point) + '</li>'; }).join('') + '</ul>';
						var sources = Array.isArray(explainer.sources) ? explainer.sources : [];
						if (sources.length) {
							html += '<div class="story-explainer-citations">';
							sources.forEach(function(source) {
								var url = safeHttpUrl(source.url || source.link);
								if (url !== '#') html += '<a class="event-evidence-link" href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(source.source || source.name || 'Context source') + '</a>';
							});
							html += '</div>';
						}
						return html + '</section>';
					}

					function renderExploreStory(story) {
						var items = Array.isArray(story.items) ? story.items.filter(Boolean) : [];
						var keyFacts = Array.isArray(story.key_facts) ? story.key_facts.filter(Boolean) : [];
						var context = story.story_context || {};
						var eventSummary = context.event_summary || {};
						var lenses = [];

						function cleanList(values) {
							var seen = {};
							return (values || []).map(function(value) { return String(value || '').trim(); }).filter(function(value) {
								var key = value.toLowerCase();
								if (!value || seen[key]) return false;
								seen[key] = true;
								return true;
							});
						}

						function sentences(value) {
							return cleanList(String(value || '').match(/[^.!?]+[.!?]+|[^.!?]+$/g) || []);
						}

						function addLens(lens) {
							if (!lens || (!lens.summary && !(lens.points || []).length && !(lens.claims || []).length)) return;
							lens.id = String(lens.id || ('lens-' + lenses.length)).toLowerCase().replace(/[^a-z0-9-]+/g, '-');
							lens.points = cleanList(lens.points || []);
							lens.claims = Array.isArray(lens.claims) ? lens.claims.filter(function(claim) { return claim && claim.text; }) : [];
							lens.sources = Array.isArray(lens.sources) ? lens.sources.filter(Boolean) : [];
							lenses.push(lens);
						}

						var suppliedLenses = Array.isArray(story.explore_lenses) ? story.explore_lenses : [];
						if (suppliedLenses.length) {
							suppliedLenses.slice(0, 5).forEach(function(lens, index) {
								addLens({
									id: lens.id || ('researched-' + index),
									label: lens.label || lens.title,
									title: lens.title || lens.label,
									summary: lens.summary || lens.answer || lens.text,
									points: lens.points || lens.key_points,
									claims: lens.claims,
									sources: lens.sources,
									note: lens.uncertainty_note || lens.note || 'Additional context generated from the cited reporting.',
									generatedAt: lens.generated_at
								});
							});
						} else {
							addLens({
								id: 'key-facts',
								label: 'Key facts',
								title: 'What the reporting establishes',
								summary: keyFacts.length ? '' : story.summary,
								points: keyFacts,
								sources: items,
								note: 'Facts drawn from the reporting used for this story.'
							});

							var summaryNextStatements = sentences(story.summary).filter(function(statement) {
								return /\b(will|scheduled|next|set to|plans? to|expected to|due to)\b/i.test(statement);
							});
							var nextStatements = summaryNextStatements.length ? summaryNextStatements : keyFacts.filter(function(statement) {
								return /\b(will|scheduled|next|set to|plans? to|expected to|due to)\b/i.test(statement);
							});
							if (nextStatements.length) addLens({
								id: 'what-next',
								label: 'What happens next?',
								title: 'The next confirmed step',
								points: nextStatements,
								sources: items,
								note: 'This includes only next steps stated in the current reporting, not a forecast.'
							});

							var developments = Array.isArray(eventSummary.key_developments) && eventSummary.key_developments.length
								? eventSummary.key_developments
								: (Array.isArray(story.timeline_highlights) ? story.timeline_highlights : []);
							if (eventSummary.summary || developments.length) addLens({
								id: 'story-so-far',
								label: displayCategory(story) === 'Sports' ? 'Path to this point' : 'Story so far',
								title: displayCategory(story) === 'Sports' ? 'How this point was reached' : 'How the story developed',
								summary: eventSummary.summary || context.summary || '',
								points: developments.slice(-4).map(function(item) {
									return (item.date ? formatStoryDate(item.date) + ': ' : '') + (item.title || item.summary || 'Update');
								}),
								sources: Array.isArray(eventSummary.sources) ? eventSummary.sources : items,
								note: 'Timeline dates reflect the information stored with this event.'
							});

							var biasGroups = {};
							items.forEach(function(item) {
								var bias = String(item.source_bias || '').toLowerCase().replace(/_/g, '-');
								if (bias === 'left-center' || bias === 'center-left') bias = 'lean-left';
								if (bias === 'right-center' || bias === 'center-right') bias = 'lean-right';
								if (['left', 'lean-left', 'center', 'lean-right', 'right', 'mixed'].indexOf(bias) === -1) return;
								if (!biasGroups[bias]) biasGroups[bias] = [];
								biasGroups[bias].push(item);
							});
							var representedBiases = Object.keys(biasGroups);
							if (representedBiases.length > 1) addLens({
								id: 'reporting-perspectives',
								label: 'Reporting perspectives',
								title: 'How the available sources are classified',
								summary: 'The current source set includes reporting classified across ' + representedBiases.join(', ') + '.',
								points: representedBiases.map(function(bias) {
									return bias.charAt(0).toUpperCase() + bias.slice(1) + ': ' + cleanList(biasGroups[bias].map(function(item) { return item.source || item.station; })).join(', ');
								}),
								sources: items,
								note: 'These labels describe supplied outlet metadata; they do not determine whether an individual claim is true.'
							});

							addLens({
								id: 'reporting-basis',
								label: 'Reporting behind it',
								title: 'Where this summary comes from',
								summary: 'This story summary draws on ' + Math.max(Number(story.source_count || 0), items.length) + ' reporting source' + (Math.max(Number(story.source_count || 0), items.length) === 1 ? '' : 's') + '.',
								points: items.slice(0, 5).map(function(item) { return (item.source || item.station || 'Source') + ': ' + (item.title || 'Original reporting'); }),
								sources: items,
								note: 'Open the cited reporting for full context and wording.'
							});
						}

						if (!lenses.length) return '';
						var html = '<section class="story-explore"><div class="story-explore-header"><div><div class="story-section-label">Optional context</div><h2>Explore this story</h2></div><p>Choose a lens. Nothing here replaces the factual summary above.</p></div><div class="story-explore-options">';
						lenses.forEach(function(lens) {
							html += '<button type="button" class="story-explore-option" aria-expanded="false" aria-controls="explore-' + escapeHtml(lens.id) + '">' + escapeHtml(lens.label || lens.title || 'Read more') + '</button>';
						});
						html += '</div>';
						lenses.forEach(function(lens) {
							html += '<div class="story-explore-panel" id="explore-' + escapeHtml(lens.id) + '"><h3>' + escapeHtml(lens.title || lens.label || 'Additional context') + '</h3>';
							if (lens.summary) html += '<p>' + escapeHtml(lens.summary) + '</p>';
							html += '<details class="story-explore-details"' + (lens.summary ? '' : ' open') + '><summary>Show evidence and details</summary>';
							var sourceById = {};
							lens.sources.forEach(function(source) { if (source.id) sourceById[source.id] = source; });
							if (lens.claims.length) {
								html += '<ul>' + lens.claims.map(function(claim) {
									var claimHtml = '<li><span class="story-explore-claim-type">' + escapeHtml(claim.claim_type || 'fact') + '</span>' + escapeHtml(claim.text);
									var claimSources = (claim.source_ids || []).map(function(id) { return sourceById[id]; }).filter(Boolean);
									if (claimSources.length) claimHtml += '<span class="story-explore-claim-citations">' + claimSources.map(function(source, sourceIndex) { var citationNumber = String(source.id || (sourceIndex + 1)).replace(/^s/i, ''); return '<a aria-label="Open supporting source" href="' + escapeHtml(safeHttpUrl(source.url || source.link)) + '" target="_blank" rel="noopener noreferrer">[' + escapeHtml(citationNumber) + ']</a>'; }).join('') + '</span>';
									return claimHtml + '</li>';
								}).join('') + '</ul>';
							} else if (lens.points.length) html += '<ul>' + lens.points.map(function(point) { return '<li>' + escapeHtml(point) + '</li>'; }).join('') + '</ul>';
							if (lens.note) html += '<p class="story-explore-note">' + escapeHtml(lens.note) + '</p>';
							if (lens.generatedAt) html += '<p class="story-explore-freshness">Last researched ' + escapeHtml(new Date(lens.generatedAt).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })) + '</p>';
							var sourcePillSeen = {};
							var validSources = lens.sources.filter(function(source) {
								if (safeHttpUrl(source.url || source.link) === '#') return false;
								var publisher = String(source.publisher || source.source || source.name || source.station || 'Source').toLowerCase();
								if (sourcePillSeen[publisher]) return false;
								sourcePillSeen[publisher] = true;
								return true;
							}).slice(0, 5);
							if (validSources.length) {
								html += '<div class="story-explore-sources">';
								validSources.forEach(function(source) {
									html += '<a title="' + escapeHtml(source.title || '') + '" href="' + escapeHtml(safeHttpUrl(source.url || source.link)) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(source.publisher || source.source || source.name || source.station || 'Source') + (source.source_type === 'primary' ? ' · Official' : '') + '</a>';
								});
								html += '</div>';
							}
							html += '</details></div>';
						});
						return html + '</section>';
					}

					// Load story from JSON
					$.getJSON(digestPath, function(data) {
						var clusters = Array.isArray(data.clusters) ? data.clusters : [];
						var storyIndex = storyKey
							? clusters.findIndex(function(candidate) { return candidate.story_id === storyKey; })
							: storyId;
						if (storyIndex < 0 || storyIndex >= clusters.length) {
							$('#story-content').html('<div class="error"><h2>Story Not Found</h2><p>The requested story does not exist. <a href="/">Return to home</a></p></div>');
							return;
						}

					var story = data.clusters[storyIndex];
					var content = '';
					var sourceCount = Number(story.source_count || (Array.isArray(story.items) ? story.items.length : 0) || 1);
					var publisherLookup = {};
					(Array.isArray(story.items) ? story.items : []).forEach(function(item) {
						var publisher = String(item.source || item.station || '').trim().toLowerCase();
						if (!publisher) { try { publisher = new URL(item.link || item.url).hostname.replace(/^www\./, ''); } catch (_error) {} }
						if (publisher) publisherLookup[publisher] = true;
					});
					var publisherCount = Object.keys(publisherLookup).length || sourceCount;
					var developmentCount = Number((story.story_context || {}).development_count || (Array.isArray(story.timeline_highlights) ? story.timeline_highlights.length : 0));
					var storyState = developmentCount > 1 ? 'Timeline updated' : sourceCount > 1 ? 'New story' : 'Single-source report';

						// Back button
						content += '<a href="' + backHref + '" class="back-button">\u2190 Back</a>';

						// Story title and trust context
						content += '<div class="story-eyebrow">' + escapeHtml(displayCategory(story)) + ' · ' + escapeHtml(storyState) + '</div>';
						content += '<div class="story-title"><h1>' + escapeHtml(story.title) + '</h1></div>';
						content += '<div class="story-meta-row">';
					var sourceLabel = publisherCount < sourceCount
						? sourceCount + ' reports · ' + publisherCount + ' publisher' + (publisherCount === 1 ? '' : 's')
						: sourceCount + ' ' + (sourceCount === 1 ? 'source' : 'sources');
					content += '<span class="story-meta-chip' + (publisherCount === 1 ? ' caution' : '') + '">' + escapeHtml(sourceLabel) + '</span>';
						if (developmentCount > 1) content += '<span class="story-meta-chip">' + developmentCount + ' developments tracked</span>';
						content += '<span class="story-meta-chip">Updated today</span></div>';

						// Content wrapper with summary and image side by side
						content += '<div class="story-content-wrapper">';
						content += '<div class="story-header-text">';
						content += '<div class="story-section-label">What happened</div>';
						content += '<div class="story-summary">' + escapeHtml(story.summary) + '</div>';
						content += '</div>';

						// Story image
						if (story.image && (story.image.url || story.image.thumbnail_url)) {
							var imageRoleLabel = story.image.image_role_label || (story.image.image_role === 'illustrative' ? 'AI illustration' : '');
							content += '<div class="story-image-frame"><img src="' + escapeHtml(safeHttpUrl(story.image.url || story.image.thumbnail_url)) + '" alt="' + escapeHtml(story.image.title || story.title) + '" class="story-image">';
							if (imageRoleLabel) content += '<span class="story-image-role">' + escapeHtml(imageRoleLabel) + '</span>';
							content += '</div>';
						}

						content += '</div>';
						content += renderExploreStory(story);
						var updateNote = story.what_changed || (story.story_context || {}).what_changed;
						if (updateNote) content += '<div class="story-update-note"><strong>What changed:</strong> ' + escapeHtml(updateNote) + '</div>';
						content += renderStoryExplainer(story);

						if (story.event_id || (story.timeline_highlights && story.timeline_highlights.length)) {
							content += '<div id="event-timeline-slot"></div>';
						}

						// Sources section
						if (story.items && story.items.length > 0) {
							content += '<div class="sources-section">';
							content += '<h2>Sources behind this summary</h2>';
							content += '<p class="section-intro">Open the original reporting and see which outlets support this development.</p>';

							story.items.forEach(function(item) {
								var domain = getSourceDomain(item.source);
								var logoPath = '/assets/logos/' + domain + '.png';

								content += '<div class="source-item">';
								content += '<img src="' + escapeHtml(logoPath) + '" alt="' + escapeHtml((item.source || 'News outlet') + ' logo') + '" title="' + escapeHtml(item.source || 'News outlet') + '" class="source-logo" onerror="this.onerror=null;this.src=\'/assets/logos/news_placeholder.png\'">';
								content += '<div class="source-info">';
								content += '<a href="' + escapeHtml(safeHttpUrl(item.link)) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(item.title || 'Read original report') + '</a>';
								content += '<div class="source-outlet">' + escapeHtml(item.source || 'Unknown outlet') + '</div>';
								content += window.MuninnEventExperience.renderSourceBadges(item);
								content += '</div>';
								content += '</div>';
							});

							content += '</div>';
						}

						// Other stories section
						content += '<div class="other-stories-section">';
						content += '<h2>More from today</h2>';
						content += '<div class="other-stories-grid" id="other-stories-grid"></div>';
						content += '</div>';

						$('#story-content').html(content);
						$('#story-content').off('click', '.story-explore-option').on('click', '.story-explore-option', function() {
							var button = $(this);
							var wasOpen = button.attr('aria-expanded') === 'true';
							var panelId = button.attr('aria-controls');
							$('#story-content .story-explore-option').attr('aria-expanded', 'false');
							$('#story-content .story-explore-panel').removeClass('active');
							if (!wasOpen) {
								button.attr('aria-expanded', 'true');
								$('#' + panelId).addClass('active');
							}
						});
						window.MuninnEventExperience.mount('#event-timeline-slot', {
							event: { event_id: story.event_id },
							story: story,
							mode: 'story'
						});

						if (story.event_id) {
							$.getJSON('/Current_news/event_timelines.json', function(timelineData) {
								var events = Array.isArray(timelineData.events) ? timelineData.events : [];
								var eventData = events.find(function(event) {
									return event.event_id === story.event_id;
								});
								if (eventData) window.MuninnEventExperience.mount('#event-timeline-slot', { event: eventData, story: story, mode: 'story' });
							});
						}

						// Prefer genuinely related coverage, then fill with a small selection from today.
						var otherStories = data.clusters.filter(function(s, index) {
							return index !== storyIndex;
						}).map(function(candidate, index) {
							return { story: candidate, index: index, score: relatednessScore(story, candidate) };
						}).sort(function(left, right) {
							return right.score - left.score || left.index - right.index;
						}).slice(0, 4).map(function(entry) { return entry.story; });

						otherStories.forEach(function(otherStory, index) {
							// Find the actual index in the original array
							var actualIndex = data.clusters.findIndex(function(s) {
								return s.title === otherStory.title;
							});

							var otherRef = otherStory.story_id
								? 'sid=' + encodeURIComponent(otherStory.story_id)
								: 'id=' + actualIndex;
							var otherUrl = '/story.html?' + otherRef + (feed ? '&feed=' + encodeURIComponent(feed) : '') + (returnCategory ? '&returnCategory=' + encodeURIComponent(returnCategory) : '');
							var card = '<a class="other-story-card" href="' + escapeHtml(otherUrl) + '">';

							card += '<div class="other-story-title">' + escapeHtml(otherStory.title) + '</div>';

							if (otherStory.image && (otherStory.image.url || otherStory.image.thumbnail_url)) {
								card += '<img src="' + escapeHtml(safeHttpUrl(otherStory.image.thumbnail_url || otherStory.image.url)) + '" alt="" class="other-story-image">';
							}

							card += '</a>';

							$('#other-stories-grid').append(card);
						});

					}).fail(function() {
						$('#story-content').html('<div class="error"><h2>Error Loading Story</h2><p>Unable to load the story. Please try again later. <a href="/">Return to home</a></p></div>');
					});
				});
			</script>

	</body>
</html>
