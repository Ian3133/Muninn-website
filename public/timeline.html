<!DOCTYPE HTML>
<html>
	<head>
		<title>Muninn - Event</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<meta name="theme-color" content="#17252d" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="mask-icon" href="/brand/muninn-mask.svg" color="#286a7a" />
		<link rel="manifest" href="/site.webmanifest" />
		<script>
			(function () {
				var storageKey = 'muninn-theme';
				var savedTheme = null;
				try { savedTheme = localStorage.getItem(storageKey); } catch (_error) {}
				var theme = savedTheme === 'dark' || savedTheme === 'light'
					? savedTheme
					: (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				document.documentElement.dataset.theme = theme;
				document.addEventListener('DOMContentLoaded', function () {
					var toggle = document.getElementById('theme-toggle');
					var themeColor = document.querySelector('meta[name="theme-color"]');
					function syncThemeControl() {
						var isDark = document.documentElement.dataset.theme === 'dark';
						if (toggle) {
							toggle.setAttribute('aria-pressed', String(isDark));
							var label = toggle.querySelector('.theme-toggle-label');
							if (label) label.textContent = isDark ? 'Light' : 'Dark';
						}
						if (themeColor) themeColor.setAttribute('content', isDark ? '#11191e' : '#f3f5f4');
					}
					if (toggle) toggle.addEventListener('click', function () {
						var nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
						document.documentElement.dataset.theme = nextTheme;
						try { localStorage.setItem(storageKey, nextTheme); } catch (_error) {}
						syncThemeControl();
					});
					syncThemeControl();
				});
			})();
		</script>
		<link rel="stylesheet" href="/assets/css/main.css" />
		<link rel="stylesheet" href="/assets/css/event-experience.css" />
		<noscript><link rel="stylesheet" href="/assets/css/noscript.css" /></noscript>
		<link rel="stylesheet" href="/assets/css/story-redesign.css" />
		<link rel="stylesheet" href="/assets/css/detail-pages.css" />
		<link rel="stylesheet" href="/assets/css/coverage-experience.css" />
	</head>
	<body class="is-preload muninn-story-page muninn-detail-page muninn-event-page">
		<div id="wrapper" class="muninn-story-shell">
			<header class="app-header">
				<div class="app-header-inner">
					<a href="/" class="brand-lockup">
						<span class="brand-mark" aria-hidden="true"><img class="brand-logo" src="/brand/muninn-mark.svg" alt="" /></span>
						<span><strong>Muninn</strong><small>News, Simplified.</small></span>
					</a>
					<nav class="primary-navigation" aria-label="Primary navigation">
						<ul>
							<li><a href="/">Today</a></li>
							<li class="active"><a href="/?category=timelines" aria-current="page">Events</a></li>
							<li><a href="/?category=your-newsletter">Weekly</a></li>
						</ul>
					</nav>
					<div class="header-actions">
						<button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
							<span class="theme-toggle-icon" aria-hidden="true"></span>
							<span class="theme-toggle-label">Dark</span>
						</button>
					</div>
				</div>
			</header>
			<main id="main" class="story-main">
				<section class="post story-view">
					<div class="timeline-shell detail-container" id="timeline-content"><div class="timeline-message">Loading event...</div></div>
				</section>
			</main>
			<div id="copyright"><ul><li>&copy; Muninn</li></ul></div>
		</div>
		<script src="/assets/js/jquery.min.js"></script>
		<script src="/assets/js/jquery.scrollex.min.js"></script>
		<script src="/assets/js/jquery.scrolly.min.js"></script>
		<script src="/assets/js/browser.min.js"></script>
		<script src="/assets/js/breakpoints.min.js"></script>
		<script src="/assets/js/util.js"></script>
		<script src="/assets/js/main.js"></script>
		<script src="/assets/js/event-experience.js"></script>
		<script>
			(function () {
				function syntheticCoverage(event) {
					var presentation = event.presentation || {};
					var timeline = Array.isArray(event.timeline) ? event.timeline : [];
					var latest = timeline[timeline.length - 1] || {};
					var overview = event.event_overview || {};
					var suppliedSummary = event.event_summary || {};
					return {
						coverage_id: 'legacy-coverage-' + (event.event_id || ''),
						legacy_event_id: event.event_id || '',
						title: presentation.base_title || event.topic_label || event.canonical_title || event.title || 'Ongoing coverage',
						coverage_begins: presentation.first_date || (timeline[0] || {}).date || '',
						verified_through: presentation.latest_date || latest.date || '',
						overview: overview.summary || (typeof suppliedSummary === 'string' ? suppliedSummary : suppliedSummary.summary) || event.summary || '',
						current_status: latest.summary || '',
						child_events: []
					};
				}

				function renderEvent(event, coverage, events, parentCoverage, parentMember) {
					var html = '<a class="timeline-back detail-back" href="/?category=timelines">&larr; Back to events</a><div id="event-experience-page"></div>';
					document.getElementById('timeline-content').innerHTML = html;
					document.title = 'Muninn - ' + ((coverage && coverage.title) || (parentMember && parentMember.title) || (event.presentation || {}).base_title || event.topic_label || event.canonical_title || event.title || 'Event');
					window.MuninnEventExperience.mount('#event-experience-page', {
						event: event,
						coverage: coverage || null,
						allEvents: events,
						parentCoverage: parentCoverage || null,
						titleOverride: parentMember && parentMember.title || '',
						summaryOverride: parentMember && parentMember.summary || '',
						mode: 'page'
					});
				}

				function resolvePage(data, coverageData) {
					var events = Array.isArray(data.events) ? data.events : [];
					var collections = Array.isArray(coverageData && coverageData.collections) ? coverageData.collections : [];
					var event = events.find(function (item) { return item.event_id === eventId; });
					if (!event) {
						document.getElementById('timeline-content').innerHTML = '<a class="timeline-back detail-back" href="/?category=timelines">&larr; Back to events</a><div class="timeline-message"><h1>Event not available</h1><p>This story may not have enough verified developments yet.</p></div>';
						return;
					}
					var coverage = collections.find(function (item) { return item.legacy_event_id === eventId; }) || null;
					var parentCoverage = collections.find(function (item) {
						return (item.child_events || []).some(function (member) { return member.event_id === eventId; });
					}) || null;
					var parentMember = parentCoverage
						? (parentCoverage.child_events || []).find(function (member) { return member.event_id === eventId; }) || null
						: null;
					if (!coverage && !parentCoverage && (event.presentation || {}).stage === 'timeline') {
						coverage = syntheticCoverage(event);
					}
					renderEvent(event, coverage, events, parentCoverage, parentMember);
				}

				var eventId = new URLSearchParams(window.location.search).get('event') || '';
				$.getJSON('/Current_news/event_timelines.json').done(function (data) {
					$.getJSON('/Current_news/coverage_collections.json')
						.done(function (coverageData) { resolvePage(data, coverageData); })
						.fail(function () { resolvePage(data, { collections: [] }); });
				}).fail(function () {
					document.getElementById('timeline-content').innerHTML = '<div class="timeline-message"><h1>Unable to load timelines</h1><p>Please try again later.</p></div>';
				});
			})();
		</script>
	</body>
</html>
