<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muninn Today Layout Lab</title>
  <style>
    :root {
      --ink: #17252d;
      --muted: #62737a;
      --teal: #286a7a;
      --teal-soft: #e3f0f2;
      --paper: #f5f6f4;
      --line: #cbd6d8;
      --surface: #fff;
      --serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: var(--sans); }
    button, select { font: inherit; }
    a { color: inherit; }

    .lab-bar {
      position: sticky;
      z-index: 20;
      top: 0;
      display: flex;
      align-items: center;
      gap: 1rem;
      min-height: 58px;
      padding: .65rem clamp(1rem, 3vw, 3rem);
      border-bottom: 1px solid var(--line);
      background: rgba(245, 246, 244, .94);
      backdrop-filter: blur(12px);
    }

    .lab-bar strong { margin-right: auto; font-family: var(--serif); font-size: 1.05rem; }
    .lab-bar > a { color: var(--teal); font-size: .76rem; font-weight: 800; text-decoration: none; }
    .lab-controls { display: flex; align-items: center; gap: .35rem; }
    .lab-controls button {
      padding: .45rem .65rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 800;
      cursor: pointer;
    }
    .lab-controls button.active { border-color: var(--teal); background: var(--teal); color: white; }
    .lab-controls label { display: flex; align-items: center; gap: .35rem; margin-left: .5rem; color: var(--muted); font-size: .72rem; }

    main { width: min(1180px, calc(100% - clamp(2rem, 6vw, 6rem))); margin: 0 auto; padding: clamp(2rem, 5vw, 4.5rem) 0 4rem; }

    .edition-heading {
      display: flex;
      align-items: end;
      gap: 2rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--teal);
    }
    .edition-heading > div { flex: 1; }
    .edition-heading span { color: var(--teal); font-size: .68rem; font-weight: 850; letter-spacing: .13em; text-transform: uppercase; }
    .edition-heading h1 { margin: .3rem 0 0; font-family: var(--serif); font-size: clamp(2rem, 4vw, 3.6rem); line-height: .95; letter-spacing: -.04em; }
    .edition-heading p { max-width: 34rem; margin: 0; color: var(--muted); font-size: .84rem; line-height: 1.5; text-align: right; }

    .lead-story {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(22rem, .95fr);
      gap: clamp(1.5rem, 4vw, 4rem);
      padding: clamp(1.5rem, 3.5vw, 3rem) 0;
      border-bottom: 1px solid var(--line);
    }
    .lead-copy { display: flex; flex-direction: column; }
    .eyebrow { color: var(--teal); font-size: .66rem; font-weight: 850; letter-spacing: .1em; text-transform: uppercase; }
    .lead-story h2 { max-width: 18ch; margin: 1rem 0; font-family: var(--serif); font-size: clamp(2rem, 4vw, 3.7rem); line-height: 1; letter-spacing: -.045em; }
    .summary { margin: auto 0 0; color: var(--muted); font-size: .92rem; line-height: 1.65; }
    .source-line { margin-top: .9rem; color: var(--muted); font-size: .72rem; }
    .source-line strong { color: var(--ink); }
    .lead-image, .support-image {
      position: relative;
      overflow: hidden;
      align-self: center;
      aspect-ratio: 3 / 2;
      background: #e5eaeb;
    }
    .lead-image img, .support-image img { width: 100%; height: 100%; object-fit: contain; }

    .support-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border-bottom: 1px solid var(--line);
    }
    .support-story {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(9rem, .7fr);
      gap: 1.2rem;
      min-width: 0;
      padding: 1.35rem 0;
    }
    .support-story:first-child { padding-right: 1.5rem; border-right: 1px solid var(--line); }
    .support-story:last-child { padding-left: 1.5rem; }
    .support-story h2 { margin: .55rem 0; font-family: var(--serif); font-size: clamp(1.2rem, 2vw, 1.75rem); line-height: 1.08; }

    .section-label { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-top: 2rem; }
    .section-label h2 { margin: 0; font-family: var(--serif); font-size: 1.4rem; }
    .section-label p { margin: 0; color: var(--muted); font-size: .72rem; }

    .story-ledger {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0 1.4rem;
      margin-top: .6rem;
    }
    .ledger-story {
      position: relative;
      min-width: 0;
      min-height: 132px;
      overflow: hidden;
      padding: .9rem 0 .8rem;
      border-top: 1px solid var(--line);
    }
    .ledger-story::after {
      position: absolute;
      z-index: 0;
      inset: 0;
      background: linear-gradient(90deg, rgba(245,246,244,.92), rgba(245,246,244,.67));
      content: "";
      pointer-events: none;
    }
    .ledger-story > *:not(.ledger-art) { position: relative; z-index: 2; }
    .ledger-art {
      position: absolute;
      z-index: 0;
      inset: 0;
      display: none;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: .22;
      filter: grayscale(.25) saturate(.55);
    }
    body.show-images .ledger-story.has-image .ledger-art { display: block; }
    .ledger-story h3 {
      display: -webkit-box;
      margin: .45rem 0 .7rem;
      overflow: hidden;
      font-size: 1rem;
      line-height: 1.2;
      letter-spacing: -.01em;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }
    .ledger-story .source-line { position: absolute !important; right: 0; bottom: .75rem; left: 0; margin: 0; }

    body[data-density="tight"] .lead-story { padding-block: 1.4rem; }
    body[data-density="tight"] .ledger-story { min-height: 108px; padding-top: .7rem; }
    body[data-density="tight"] .ledger-story h3 { margin-top: .32rem; font-size: .92rem; -webkit-line-clamp: 2; }
    body[data-density="tight"] .support-story { padding-block: 1rem; }

    body[data-layout="stream"] .story-ledger { grid-template-columns: 1fr; }
    body[data-layout="stream"] .ledger-story { min-height: 92px; padding-right: 9rem; }
    body[data-layout="stream"] .ledger-story h3 { max-width: 52rem; font-size: 1.08rem; -webkit-line-clamp: 2; }
    body[data-layout="stream"] .ledger-story .source-line { right: 0; left: auto; bottom: auto; top: .9rem; width: 8rem; text-align: right; }

    body[data-layout="rail"] .support-story {
      position: relative;
      display: block;
      min-height: 176px;
      overflow: hidden;
    }
    body[data-layout="rail"] .support-story > div:first-child {
      position: relative;
      z-index: 3;
      max-width: 82%;
    }
    body[data-layout="rail"] .support-story h2 {
      max-width: 19ch;
      font-size: clamp(1.35rem, 2.25vw, 2rem);
      text-shadow: 0 1px 0 var(--paper), 0 0 12px var(--paper);
    }
    body[data-layout="rail"] .support-image {
      position: absolute;
      z-index: 0;
      right: 0;
      bottom: 0;
      width: 58%;
      height: 100%;
      aspect-ratio: auto;
      background: transparent;
    }
    body[data-layout="rail"] .support-image img { object-position: right bottom; }
    body[data-layout="rail"] .support-story::after {
      position: absolute;
      z-index: 1;
      inset: 0;
      background: linear-gradient(90deg, var(--paper) 0%, rgba(245,246,244,.96) 43%, rgba(245,246,244,.62) 68%, rgba(245,246,244,.08) 100%);
      content: "";
      pointer-events: none;
    }

    body[data-layout="rail"] .story-ledger { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 1.35rem; }
    body[data-layout="rail"] .ledger-story { min-height: 104px; padding-right: 11rem; }
    body[data-layout="rail"] .ledger-art {
      inset: .3rem 0 .3rem auto;
      display: block;
      width: 10.25rem;
      object-fit: contain;
      opacity: .9;
      filter: saturate(.75);
    }
    body[data-layout="rail"] .ledger-story::after { background: linear-gradient(90deg, var(--paper) 0%, var(--paper) 55%, rgba(245,246,244,.72) 70%, transparent 91%); }
    body[data-layout="rail"] .ledger-story .source-line { right: 11rem; }
    body[data-layout="rail"][data-density="tight"] .ledger-story { min-height: 96px; padding-top: .58rem; }

    .status { padding: 2rem 0; color: var(--muted); }

    @media (max-width: 820px) {
      .lab-bar { flex-wrap: wrap; }
      .lab-controls { width: 100%; overflow-x: auto; }
      .lead-story { grid-template-columns: 1fr; }
      .lead-image { grid-row: 1; }
      .support-grid { grid-template-columns: 1fr; }
      .support-story:first-child { padding-right: 0; border-right: 0; }
      .support-story:last-child { padding-left: 0; }
      .story-ledger, body[data-layout="rail"] .story-ledger { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      main { width: min(100% - 2rem, 1180px); }
      .edition-heading { display: block; }
      .edition-heading p { margin-top: .6rem; text-align: left; }
      .support-story { grid-template-columns: 1fr; }
      .story-ledger, body[data-layout="rail"] .story-ledger { grid-template-columns: 1fr; }
      body[data-layout="stream"] .ledger-story,
      body[data-layout="rail"] .ledger-story { padding-right: 0; }
      body[data-layout="stream"] .ledger-story .source-line,
      body[data-layout="rail"] .ledger-story .source-line { position: static !important; width: auto; margin-top: .7rem; text-align: left; }
      body[data-layout="rail"] .ledger-art { opacity: .18; width: 100%; }
    }
  </style>
</head>
<body class="show-images" data-layout="rail" data-density="tight">
  <header class="lab-bar">
    <strong>Muninn Today Layout Lab</strong>
    <a href="/">Return to Today</a>
    <div class="lab-controls" aria-label="Layout controls">
      <button type="button" data-layout-button="ledger">Flat ledger</button>
      <button type="button" data-layout-button="stream">News stream</button>
      <button type="button" class="active" data-layout-button="rail">Image rail</button>
      <button type="button" class="active" id="density-toggle">Tight density</button>
      <label><input id="image-toggle" type="checkbox" checked /> Images</label>
    </div>
  </header>

  <main>
    <header class="edition-heading">
      <div>
        <span>Experimental edition</span>
        <h1>Today’s Top Stories</h1>
      </div>
      <p>No cards, no shadows, and no production changes. Switch layouts above to compare density and image behavior.</p>
    </header>
    <div id="lab-content" class="status">Loading the current digest…</div>
  </main>

  <script>
    const content = document.getElementById('lab-content');
    const clean = (value) => String(value || '').trim();
    const imageUrl = (story) => story?.image?.url || story?.image?.thumbnail_url || '';
    const sourceNames = (story) => [...new Set((story?.sources || []).map((source) => typeof source === 'string' ? source : source?.name).filter(Boolean))];
    const category = (story) => clean(story?.category && story.category.toLowerCase() !== 'top story' ? story.category : story?.topic_label || 'News');
    const summary = (story) => clean(story?.summary).replace(/\s+/g, ' ');

    function textElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = text;
      return element;
    }

    function sourceLine(story) {
      const sources = sourceNames(story);
      const line = document.createElement('div');
      line.className = 'source-line';
      const count = textElement('strong', '', `${sources.length || story?.source_count || 0} outlets`);
      line.append(count, document.createTextNode(sources.length ? ` · ${sources.slice(0, 3).join(', ')}${sources.length > 3 ? ` +${sources.length - 3}` : ''}` : ''));
      return line;
    }

    function picture(story, className) {
      const wrapper = document.createElement('div');
      wrapper.className = className;
      const url = imageUrl(story);
      if (url) {
        const image = document.createElement('img');
        image.src = url;
        image.alt = '';
        wrapper.append(image);
      }
      return wrapper;
    }

    function render(stories) {
      content.className = '';
      content.replaceChildren();

      const lead = stories[0];
      const leadArticle = document.createElement('article');
      leadArticle.className = 'lead-story';
      const leadCopy = document.createElement('div');
      leadCopy.className = 'lead-copy';
      leadCopy.append(
        textElement('span', 'eyebrow', category(lead)),
        textElement('h2', '', clean(lead?.title)),
        textElement('p', 'summary', summary(lead)),
        sourceLine(lead)
      );
      leadArticle.append(leadCopy, picture(lead, 'lead-image'));

      const support = document.createElement('div');
      support.className = 'support-grid';
      stories.slice(1, 3).forEach((story) => {
        const article = document.createElement('article');
        article.className = 'support-story';
        const copy = document.createElement('div');
        copy.append(textElement('span', 'eyebrow', category(story)), textElement('h2', '', clean(story?.title)), sourceLine(story));
        article.append(copy, picture(story, 'support-image'));
        support.append(article);
      });

      const label = document.createElement('div');
      label.className = 'section-label';
      label.append(textElement('h2', '', 'More from today'), textElement('p', '', 'Six stories · switch the layout above'));

      const ledger = document.createElement('section');
      ledger.className = 'story-ledger';
      stories.slice(3, 9).forEach((story) => {
        const article = document.createElement('article');
        article.className = `ledger-story ${imageUrl(story) ? 'has-image' : ''}`;
        if (imageUrl(story)) {
          const art = document.createElement('img');
          art.className = 'ledger-art';
          art.src = imageUrl(story);
          art.alt = '';
          article.append(art);
        }
        article.append(textElement('span', 'eyebrow', category(story)), textElement('h3', '', clean(story?.title)), sourceLine(story));
        ledger.append(article);
      });

      content.append(leadArticle, support, label, ledger);
    }

    fetch('/Current_news/digest.json')
      .then((response) => {
        if (!response.ok) throw new Error(`Digest returned ${response.status}`);
        return response.json();
      })
      .then((data) => render(Array.isArray(data?.clusters) ? data.clusters.slice(0, 9) : []))
      .catch((error) => {
        content.className = 'status';
        content.textContent = `Unable to load the digest: ${error.message}`;
      });

    document.querySelectorAll('[data-layout-button]').forEach((button) => {
      button.addEventListener('click', () => {
        document.body.dataset.layout = button.dataset.layoutButton;
        document.querySelectorAll('[data-layout-button]').forEach((item) => item.classList.toggle('active', item === button));
      });
    });

    document.getElementById('density-toggle').addEventListener('click', (event) => {
      const tight = document.body.dataset.density !== 'tight';
      document.body.dataset.density = tight ? 'tight' : 'comfortable';
      event.currentTarget.classList.toggle('active', tight);
      event.currentTarget.textContent = tight ? 'Tight density' : 'Comfortable density';
    });

    document.getElementById('image-toggle').addEventListener('change', (event) => {
      document.body.classList.toggle('show-images', event.currentTarget.checked);
    });
  </script>
</body>
</html>
